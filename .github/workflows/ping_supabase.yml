name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: "0 9 * * 1,4" # Runs at 9:00 AM UTC every Monday and Thursday
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Keep Supabase Active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_KEY;

          if (!url || !key) {
            console.error('❌ Error: Missing SUPABASE_URL or SUPABASE_KEY repository secrets.');
            process.exit(1);
          }

          const supabase = createClient(url, key);
          supabase
            .from('notices')
            .select('id')
            .limit(1)
            .then(({ data, error }) => {
              if (error) {
                console.error('❌ Supabase ping error:', error.message);
                process.exit(1);
              }
              console.log('✅ Supabase ping successful! Database is active and responsive.');
              console.log('Query result sample:', data);
            })
            .catch((err) => {
              console.error('❌ Unexpected ping failure:', err);
              process.exit(1);
            });
          "
