name: BJWS CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: "https://bjws.org"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
      SUPABASE_SECRET_KEY: "placeholder-secret-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code formatting verification
        run: npm run format:check

      - name: Static code analysis (ESLint)
        run: npm run lint

      - name: TypeScript strict verification
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

